---
grafana_role:
  install: true
  configure: true
  uninstall: false
  uninstall_opts:
    remove_unit: false
    remove_conf: false
    remove_executables: false
    remove_grafana: false
grafana_user: "grafana"
grafana_group: "grafana"
# grafana packages contain build id, and there is seemingly no way of discovering it dynamically
# you should grab a link for yourself and paste it, instead of using variables such as version, etc.
grafana_bin_uri: "https://dl.grafana.com/grafana/release/12.3.1/grafana_12.3.1_20271043721_linux_amd64.tar.gz"

grafana_unit_dir: "/usr/lib/systemd/system"
grafana_exec_dir: "/usr/sbin/"
# these directories should be subdirectories of a more global
# directory, since the ownership will be overwritten, and in case
# of directories like /var/lib it can lead to ownership problems
grafana_dir: "/usr/local/grafana"
grafana_conf_dir: "/etc/grafana"
grafana_log_dir: "/var/log/grafana"
grafana_data_dir: "/var/lib/grafana"
grafana_plugins_dir: "{{ grafana_data_dir }}/plugins"
grafana_provision_dir: "{{ grafana_conf_dir }}/provisioning"
grafana_runtime_directory: "grafana"
grafana_runtime_directory_mode: "0750"

grafana_restart_on: "always"
grafana_unit_options: {}
#  LimitNOFILE: "10000"
#  TimeoutStopSec: "20"
#  AmbientCapabilities: "CAP_NET_BIND_SERVICE"
#  CapabilityBoundingSet: "CAP_NET_BIND_SERVICE"
#  DeviceAllow: ""
#  LockPersonality: "true"
#  MemoryDenyWriteExecute: "false"
#  NoNewPrivileges: "true"
#  PrivateDevices: "true"
#  PrivateTmp: "true"
#  ProtectClock: "true"
#  ProtectControlGroups: "true"
#  ProtectHome: "true"
#  ProtectHostname: "true"
#  ProtectKernelLogs: "true"
#  ProtectKernelModules: "true"
#  ProtectKernelTunables: "true"
#  ProtectProc: "invisible"
#  ProtectSystem: "full"
#  RemoveIPC: "true"
#  RestrictAddressFamilies: "AF_INET AF_INET6 AF_UNIX"
#  RestrictNamespaces: "true"
#  RestrictRealtime: "true"
#  RestrictSUIDSGID: "true"
#  SystemCallArchitectures: "native"
#  UMask: "0027"

grafana_ini_default:
  app_mode: "development"
  instance_name: "${HOSTNAME}"

  paths:
    data: "{{ grafana_data_dir }}"
    temp_data_lifetime: "24h"
    logs: "{{ grafana_log_dir }}"
    plugins: "{{ grafana_plugins_dir }}"
    provisioning: "{{ grafana_provision_dir }}"

  server:
    protocol: http
    #min_tls_version: TLS1.2
    http_addr: 0.0.0.0
    http_port: 3000
    #domain: example.com
    enforce_domain: false
    root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
    serve_from_sub_path: false
    router_logging: true
    static_root_path: public
    enable_gzip: false
    #cert_file: certfile
    #cert_key: certkey
    #cert_pass: certpass
    #certs_watch_interval: 60m
    #custom_respone_headers: {}

  environment: {}
  database:
    type: sqlite3
    #host: 127.0.0.1:3306
    #name: grafana
    #user: root
    #password: secret

  remote_cache:
    type: database
    #connstr: 127.0.0.1:11211
    #prefix: prefix
    #encryption: true

  dataproxy: {}
  
  analytics: {}

  security:
    disable_initial_admin_creation: false
    admin_user: admin
    admin_password: ""
    admin_email: "admin@localhost"
    #secret_key: AES-256-CFB

  users:
    allow_sign_up: false
    auto_assign_org_role: Viewer
    default_theme: dark

  auth:
    disable_login_form: false
    disable_signout_menu: false
    #signout_redirect_url: sso.localhost
