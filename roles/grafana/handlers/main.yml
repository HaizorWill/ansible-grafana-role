---
- name: disable grafana service
  become: true
  ansible.builtin.systemd_service:
    name: "grafana-server"
    enabled: false
    state: "stopped"

- name: systemd daemon-reload
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: enable grafana service
  become: true
  ansible.builtin.systemd_service:
    name: "grafana-server"
    enabled: true
    state: "restarted"
