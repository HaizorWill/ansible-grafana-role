---
- name: grafana group is present
  ansible.builtin.group:
    name: "{{ grafana_group }}"
    state: "present"
- name: grafana user is present
  ansible.builtin.user:
    name: "{{ grafana_user }}"
    group: "{{ grafana_group }}"
    state: "present"
    system: true
    shell: "/bin/false"
- name: grafana bin directory is present
  ansible.builtin.file:
    path: "{{ grafana_dir }}"
    owner: "root"
    group: "root"
    mode: "755"
    state: "directory"
- name: grafana binary is unarchived
  ansible.builtin.unarchive:
    src: "{{ grafana_bin_uri }}"
    dest: "{{ grafana_dir }}"
    owner: "root"
    group: "root"
    remote_src: "yes"
    extra_opts:
      - "--strip-components=1"
    creates: "{{ grafana_dir }}/bin/grafana-server"
